<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>CRM — Leads do Quiz · Kenji Hirota</title>
<style>
  :root{--accent:#6d4bf5;--accent-2:#9068ff;--ink:#1b1a2e;--muted:#6b6a80;--line:#e9e7f2;--bg:#f5f3fb;--card:#fff;
    --novo:#6d4bf5;--contatado:#e2a400;--vendido:#18b98a;--perdido:#9896ac;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  a{color:var(--accent)}
  /* login */
  .login-wrap{min-height:100dvh;display:grid;place-items:center;padding:20px}
  .login{background:var(--card);border-radius:20px;box-shadow:0 20px 60px -25px rgba(70,45,150,.4);padding:34px 30px;width:100%;max-width:360px}
  .login h1{font-size:20px;margin:0 0 6px}.login p{color:var(--muted);font-size:14px;margin:0 0 20px}
  .input{width:100%;border:1.6px solid var(--line);border-radius:13px;padding:14px;font-size:16px;outline:none;margin-bottom:12px;background:#fbfaff}
  .input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(109,75,245,.13)}
  .btn{width:100%;border:0;border-radius:13px;padding:14px;font-size:15px;font-weight:750;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:10px}
  .btn.ghost{background:#efedf8;color:var(--ink)}
  .err{color:#d63b4a;font-size:13px;margin:2px 0 12px;min-height:16px}
  /* dashboard */
  .top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  .top .brand{font-weight:800;font-size:16px;display:flex;align-items:center;gap:9px}
  .top .brand .dot{width:28px;height:28px;border-radius:9px;background:linear-gradient(140deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-weight:800}
  .spacer{flex:1}
  .stats{display:flex;gap:10px;flex-wrap:wrap;padding:16px 20px 4px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:110px}
  .stat .n{font-size:24px;font-weight:850}.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 20px}
  .toolbar .input,.toolbar select{margin:0;padding:10px 12px;font-size:14px;border-radius:11px;border:1.6px solid var(--line);background:#fff}
  .toolbar .input{min-width:220px;flex:1}
  .wrap{padding:0 20px 40px}
  .tablecard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{ text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:800;padding:13px 14px;border-bottom:1px solid var(--line);background:#faf9fe}
  td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:#fbfaff}
  .pill{display:inline-block;font-size:11px;font-weight:750;padding:4px 10px;border-radius:999px;background:#f0ecff;color:var(--accent)}
  .wa{font-weight:650;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
  .wa:hover{color:#18b98a}
  select.status{border:1.5px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12.5px;font-weight:700;cursor:pointer}
  .st-novo{color:var(--novo)}.st-contatado{color:var(--contatado)}.st-vendido{color:var(--vendido)}.st-perdido{color:var(--perdido)}
  .link{color:var(--accent);cursor:pointer;font-weight:700;font-size:13px;background:none;border:0}
  .empty{padding:50px 20px;text-align:center;color:var(--muted)}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(20,15,45,.45);display:none;place-items:center;padding:18px;z-index:20}
  .modal-bg.on{display:grid}
  .modal{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:26px}
  .modal h2{margin:0 0 4px;font-size:20px}.modal .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .kv{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv .k{color:var(--muted);min-width:120px;font-weight:600}
  .ans{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
  .ans .q{font-size:13px;color:var(--muted);margin-bottom:3px}
  .ans .a{font-size:14px;font-weight:600}
  .ans .tag{font-size:11px;color:var(--accent);font-weight:700}
  .x{float:right;border:0;background:#f0eef8;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:16px}
  @media(max-width:640px){ .hide-sm{display:none} td,th{padding:10px 8px} }
</style>
</head>
<body>
<div id="app"></div>

<script>
const app = document.getElementById('app');
let LEADS = [];
const PERFIS = ['Perfeccionista','Evitativo','Impulsivo','Sobrecarregado','Indeciso'];
const EMO = {Perfeccionista:'🎯',Evitativo:'🚪',Impulsivo:'⚡',Sobrecarregado:'🌀',Indeciso:'🧭'};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(s){try{const d=new Date(s);return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});}catch{return s;}}
function waDigits(w){return String(w||'').replace(/\D/g,'');}

async function boot(){
  const r = await fetch('/api/leads');
  if(r.status===401){ renderLogin(); return; }
  if(!r.ok){ app.innerHTML='<div class="empty">Erro ao carregar. Recarregue a página.</div>'; return; }
  const j = await r.json(); LEADS = j.leads||[]; renderDash();
}

/* ---------- LOGIN ---------- */
function renderLogin(msg){
  app.innerHTML = `<div class="login-wrap"><form class="login" id="lf">
    <h1>🔒 Área do Kenji</h1><p>Entre para ver os leads do quiz.</p>
    <input class="input" id="pw" type="password" placeholder="Senha" autofocus />
    <div class="err" id="err">${msg||''}</div>
    <button class="btn" type="submit">Entrar</button></form></div>`;
  document.getElementById('lf').addEventListener('submit', async e=>{
    e.preventDefault();
    const err=document.getElementById('err'); err.textContent='';
    const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:document.getElementById('pw').value})});
    if(r.ok){ boot(); } else { const j=await r.json().catch(()=>({})); err.textContent = j.error||'Falha no login.'; }
  });
}

/* ---------- DASHBOARD ---------- */
function counts(){const c={total:LEADS.length,novo:0,contatado:0,vendido:0,perdido:0};
  LEADS.forEach(l=>{c[l.status]=(c[l.status]||0)+1;});return c;}

function renderDash(){
  const c=counts();
  app.innerHTML = `
  <div class="top">
    <div class="brand"><span class="dot">K</span> CRM · Leads do Quiz</div>
    <div class="spacer"></div>
    <button class="btn sm ghost" onclick="doExport()">⬇️ Exportar CSV</button>
    <button class="btn sm ghost" onclick="boot()">↻ Atualizar</button>
    <button class="btn sm ghost" onclick="logout()">Sair</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="n">${c.total}</div><div class="l">Total</div></div>
    <div class="stat"><div class="n st-novo">${c.novo||0}</div><div class="l">Novos</div></div>
    <div class="stat"><div class="n st-contatado">${c.contatado||0}</div><div class="l">Contatados</div></div>
    <div class="stat"><div class="n st-vendido">${c.vendido||0}</div><div class="l">Vendidos</div></div>
  </div>
  <div class="toolbar">
    <input class="input" id="q" placeholder="🔎 Buscar por WhatsApp, perfil, UTM..." oninput="renderTable()" />
    <select id="fp" onchange="renderTable()">
      <option value="">Todos os perfis</option>
      ${PERFIS.map(p=>`<option value="${p}">${EMO[p]} ${p}</option>`).join('')}
    </select>
    <select id="fs" onchange="renderTable()">
      <option value="">Todos os status</option>
      ${['novo','contatado','vendido','perdido'].map(s=>`<option value="${s}">${s}</option>`).join('')}
    </select>
  </div>
  <div class="wrap"><div class="tablecard" id="tbl"></div></div>
  <div class="modal-bg" id="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>`;
  renderTable();
}

function filtered(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const fp=document.getElementById('fp').value, fs=document.getElementById('fs').value;
  return LEADS.filter(l=>{
    if(fp && l.profile!==fp) return false;
    if(fs && l.status!==fs) return false;
    if(q){ const hay=(l.whatsapp+' '+(l.name||'')+' '+l.profile+' '+JSON.stringify(l.utm||{})).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}

function renderTable(){
  const rows=filtered();
  const tbl=document.getElementById('tbl');
  if(!rows.length){ tbl.innerHTML='<div class="empty">Nenhum lead ainda. Assim que alguém terminar o quiz, aparece aqui. 👀</div>'; return; }
  tbl.innerHTML = `<table><thead><tr>
    <th>Data</th><th>Nome</th><th>WhatsApp</th><th>Perfil</th><th class="hide-sm">Origem</th><th>Status</th><th></th>
  </tr></thead><tbody>${rows.map(rowHTML).join('')}</tbody></table>`;
}
function rowHTML(l){
  const wa=waDigits(l.whatsapp);
  const origem = (l.utm && (l.utm.utm_campaign||l.utm.utm_source)) ? esc(l.utm.utm_campaign||l.utm.utm_source) : '—';
  return `<tr>
    <td style="color:var(--muted);white-space:nowrap">${fmtDate(l.created_at)}</td>
    <td style="font-weight:650">${esc(l.name)||'—'}</td>
    <td><a class="wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">💬 ${esc(l.whatsapp)}</a></td>
    <td>${l.profile?`<span class="pill">${EMO[l.profile]||''} ${esc(l.profile)}</span>`:'—'}</td>
    <td class="hide-sm" style="color:var(--muted);font-size:12.5px">${origem}</td>
    <td>${statusSelect(l)}</td>
    <td><button class="link" onclick='openModal(${l.id})'>ver</button></td>
  </tr>`;
}
function statusSelect(l){
  const opts=['novo','contatado','vendido','perdido'];
  return `<select class="status st-${l.status}" onchange="setStatus(${l.id},this.value,this)">
    ${opts.map(o=>`<option value="${o}"${o===l.status?' selected':''}>${o}</option>`).join('')}</select>`;
}

async function setStatus(id,status,el){
  el.className='status st-'+status;
  const r=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});
  if(r.ok){ const l=LEADS.find(x=>x.id===id); if(l)l.status=status; const c=counts();
    // atualiza os números dos cards sem re-render completo
    const s=document.querySelectorAll('.stat .n'); if(s.length>=4){s[0].textContent=c.total;s[1].textContent=c.novo||0;s[2].textContent=c.contatado||0;s[3].textContent=c.vendido||0;}
  } else { alert('Não consegui salvar o status.'); }
}

function openModal(id){
  const l=LEADS.find(x=>x.id===id); if(!l) return;
  const ans=(l.answers||[]).map(a=>`<div class="ans"><div class="q">${esc(a.q)}</div><div class="a">${esc(a.a)}</div><div class="tag">→ ${esc(a.perfil)}</div></div>`).join('');
  const utm=l.utm&&Object.keys(l.utm).length?Object.entries(l.utm).map(([k,v])=>`<div class="kv"><div class="k">${esc(k)}</div><div>${esc(v)}</div></div>`).join(''):'<div class="kv"><div class="k">—</div><div>sem UTM (tráfego direto)</div></div>';
  document.getElementById('modal').innerHTML = `
    <button class="x" onclick="closeModal()">✕</button>
    <h2>${EMO[l.profile]||''} O ${esc(l.profile)||'—'}</h2>
    <div class="sub">${fmtDate(l.created_at)}</div>
    <div class="kv"><div class="k">Nome</div><div>${esc(l.name)||'—'}</div></div>
    <div class="kv"><div class="k">WhatsApp</div><div><a class="wa" href="https://wa.me/${waDigits(l.whatsapp)}" target="_blank" rel="noopener">${esc(l.whatsapp)}</a></div></div>
    <div class="kv"><div class="k">Gênero / Idade</div><div>${esc(l.gender)||'—'} · ${esc(l.age)||'—'}</div></div>
    <div class="kv"><div class="k">Status</div><div>${esc(l.status)}</div></div>
    <h3 style="margin:18px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)">Respostas</h3>
    ${ans||'<div class="sub">—</div>'}
    <h3 style="margin:18px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)">Origem (UTM)</h3>
    ${utm}
    <div style="margin-top:20px;padding-top:14px;border-top:1px solid var(--line);text-align:right"><button class="link" style="color:#d63b4a" onclick="delLead(${l.id})">🗑️ Excluir este lead</button></div>`;
  document.getElementById('modalbg').classList.add('on');
}
function closeModal(){document.getElementById('modalbg').classList.remove('on');}
async function delLead(id){
  if(!confirm('Excluir este lead? Essa ação não tem volta.')) return;
  const r=await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  if(r.ok){ LEADS=LEADS.filter(x=>x.id!==id); closeModal(); renderDash(); } else { alert('Não consegui excluir o lead.'); }
}

async function logout(){ await fetch('/api/logout',{method:'POST'}); renderLogin(); }

function doExport(){
  const rows=filtered();
  const cols=['data','nome','whatsapp','perfil','genero','idade','status','utm_source','utm_campaign'];
  const csv=[cols.join(',')].concat(rows.map(l=>{
    const u=l.utm||{};
    return [fmtDate(l.created_at),l.name,l.whatsapp,l.profile,l.gender,l.age,l.status,u.utm_source||'',u.utm_campaign||'']
      .map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',');
  })).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='leads-kenji.csv';a.click();
}

boot();
</script>
</body>
</html>
