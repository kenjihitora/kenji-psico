<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Painel · Kenji Hirota</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/favicon.png" />
<style>
  :root{--accent:#6d4bf5;--accent-2:#9068ff;--ink:#1b1a2e;--muted:#6b6a80;--line:#e9e7f2;--bg:#f5f3fb;--card:#fff;
    --novo:#6d4bf5;--contatado:#e2a400;--vendido:#18b98a;--reembolsado:#d0564a;--perdido:#9896ac;--teste:#64748b;--ok:#18b98a;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  a{color:var(--accent)}
  /* login */
  .login-wrap{min-height:100dvh;display:grid;place-items:center;padding:20px}
  .login{background:var(--card);border-radius:20px;box-shadow:0 20px 60px -25px rgba(70,45,150,.4);padding:32px 28px;width:100%;max-width:360px;text-align:center}
  .login img{height:52px;width:auto;margin-bottom:6px}
  .login h1{font-size:18px;margin:0 0 4px}.login p{color:var(--muted);font-size:14px;margin:0 0 20px}
  .input{width:100%;border:1.6px solid var(--line);border-radius:13px;padding:14px;font-size:16px;outline:none;background:#fbfaff}
  .input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(109,75,245,.13)}
  .login .input{margin-bottom:12px}
  .btn{border:0;border-radius:13px;padding:13px 16px;font-size:15px;font-weight:750;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .btn.full{width:100%}
  .btn.sm{padding:9px 13px;font-size:13px;border-radius:10px}
  .btn.ghost{background:#efedf8;color:var(--ink)}
  .err{color:#d63b4a;font-size:13px;margin:2px 0 12px;min-height:16px}
  /* topbar */
  .top{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
  .top .logo{height:24px;width:auto}
  .tabs{display:flex;gap:6px;background:#f1eff8;border-radius:12px;padding:4px}
  .tab{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:8px 16px;border-radius:9px;cursor:pointer;transition:.15s}
  .tab.on{background:#fff;color:var(--accent);box-shadow:0 2px 8px -3px rgba(70,45,150,.35)}
  .spacer{flex:1}
  .wrap{padding:20px 24px;max-width:none;margin:0}
  /* cards de stat */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .stat .n{font-size:28px;font-weight:850;line-height:1}.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-top:6px}
  .stat .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px}
  .panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 16px;font-weight:800}
  /* date selector */
  .dates{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
  .dates label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px}
  .dates input{border:1.6px solid var(--line);border-radius:11px;padding:9px 11px;font-size:14px;background:#fff}
  .presets{display:flex;gap:6px}
  .preset{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:650;cursor:pointer;color:var(--muted)}
  .preset:hover{border-color:var(--accent-2);color:var(--accent)}
  .mswitch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;font-weight:650;color:var(--ink);user-select:none}
  .mswitch input{position:absolute;opacity:0;width:0;height:0}
  .mswitch .track{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:0 0 auto}
  .mswitch .track::after{content:"";position:absolute;top:2.5px;left:2.5px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
  .mswitch input:checked + .track{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .mswitch input:checked + .track::after{transform:translateX(18px)}
  /* funil */
  .fstep{margin-bottom:14px}
  .fl{display:flex;justify-content:space-between;font-size:13.5px;font-weight:650;margin-bottom:5px}
  .fl .c{color:var(--muted);font-weight:600}
  .ftrack{height:26px;background:var(--line);border-radius:8px;overflow:hidden;position:relative}
  .ftrack > i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .7s cubic-bezier(.3,.7,.3,1);min-width:2px}
  .fdrop{font-size:11.5px;color:#d0655a;margin-top:3px;font-weight:600}
  /* tabelas / breakdown */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:800;padding:11px 12px;border-bottom:1px solid var(--line)}
  td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .minibar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;min-width:60px}
  .minibar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .pill{display:inline-block;font-size:11px;font-weight:750;padding:4px 10px;border-radius:999px;background:#f0ecff;color:var(--accent)}
  .compill{display:inline-block;font-size:11px;font-weight:750;padding:4px 10px;border-radius:999px;background:#e2f8ef;color:#0e9a72}
  .buypill{display:inline-block;font-size:11px;font-weight:750;padding:4px 10px;border-radius:999px;background:#fff3d9;color:#a06a00}
  /* 🛒 compras do lead (modal) */
  .purrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .purrow .purdt{font-size:11.5px;color:var(--muted);font-weight:500}
  .purrow.purtot{border-bottom:0;font-weight:800;color:#a06a00}
  .purx{border:0;background:#fdecea;color:#d63b4a;width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:12px;flex:0 0 auto}
  /* CRM toolbar */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar .input,.toolbar select{padding:10px 12px;font-size:14px;border-radius:11px;border:1.6px solid var(--line);background:#fff}
  .toolbar .input{min-width:220px;flex:1}
  .viewtoggle{display:flex;background:#f1eff8;border-radius:10px;padding:3px}
  .viewtoggle button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
  .viewtoggle button.on{background:#fff;color:var(--accent);box-shadow:0 1px 4px -1px rgba(0,0,0,.15)}
  /* CRM cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .lcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .lcard .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .lcard .nm{font-size:16px;font-weight:800;line-height:1.2}
  .lcard .dt{font-size:11.5px;color:var(--muted)}
  .lcard .origin{font-size:12px;color:var(--muted);background:#faf9fe;border:1px solid var(--line);border-radius:9px;padding:7px 9px;line-height:1.4}
  .lcard .origin b{color:var(--ink);font-weight:650}
  /* CRM kanban (colunas por status) */
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
  .column{flex:1;min-width:250px;background:#f1eff8;border-radius:14px;padding:10px;transition:background .15s,outline .15s}
  .column.over{background:#e7e0fc;outline:2px dashed var(--accent-2);outline-offset:-2px}
  .colhead{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;padding:6px 6px 12px}
  .colhead .dotc{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .colhead .cnt{margin-left:auto;background:#fff;color:var(--muted);font-size:12px;font-weight:750;padding:2px 10px;border-radius:999px}
  .colbody{display:flex;flex-direction:column;gap:10px;min-height:50px}
  .colempty{color:#b7b4cc;font-size:13px;text-align:center;padding:14px 0}
  .kcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:grab;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 3px rgba(30,20,70,.05)}
  .kcard:active{cursor:grabbing}
  .kcard .nm{font-size:15px;font-weight:800;line-height:1.15}
  .kcard .dt{font-size:11px;color:var(--muted)}
  .kcard .korigin{font-size:11.5px;color:var(--muted)}
  .kcard .incol{font-size:11px;color:var(--accent);font-weight:650;background:#f4f1ff;border-radius:7px;padding:3px 8px;align-self:flex-start}
  .wa{font-weight:650;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
  .wa:hover{color:#18b98a}
  select.status{border:1.5px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12.5px;font-weight:700;cursor:pointer}
  .st-novo{color:var(--novo)}.st-contatado{color:var(--contatado)}.st-vendido{color:var(--vendido)}.st-reembolsado{color:var(--reembolsado)}.st-perdido{color:var(--perdido)}.st-teste{color:var(--teste)}
  .tablecard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  tr:hover td{background:#fbfaff}
  .link{color:var(--accent);cursor:pointer;font-weight:700;font-size:13px;background:none;border:0}
  .empty{padding:44px 20px;text-align:center;color:var(--muted)}
  .loading{padding:40px;text-align:center;color:var(--muted)}
  /* Campanhas */
  .connect{text-align:center;padding:38px 24px}
  .connect-ico{font-size:44px;margin-bottom:6px}
  .connect h2{font-size:19px;margin:0 0 8px}
  .connect p{color:var(--muted);font-size:14px;line-height:1.55;max-width:540px;margin:0 auto 8px}
  .connect .setup{max-width:470px;margin:14px auto 0;text-align:left;color:var(--ink);font-size:13.5px;line-height:1.75}
  .connect .errmsg{color:#c0392b;font-weight:650;background:#fdecea;border-radius:10px;padding:10px 14px;display:inline-block;max-width:560px}
  code{background:#f0ecff;color:var(--accent);padding:1px 6px;border-radius:6px;font-size:.88em;font-weight:650}
  .metacmp{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
  .hl{color:var(--accent)}
  .fineprint{font-size:12px;color:var(--muted);line-height:1.6;margin:6px 2px 0}
  .metricwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.mt{min-width:1440px;font-size:13.5px}
  table.mt th,table.mt td{padding:12px 14px}
  table.mt th.num,table.mt td.num{text-align:right;white-space:nowrap}
  table.mt td.nm{white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
  table.mt tr.clk{cursor:pointer}
  table.mt tr.clk:hover td{background:#faf9ff}
  table.mt .dq{color:var(--muted);font-weight:800;margin-left:2px}
  table.mt tr.totrow td{font-weight:800;border-top:2px solid var(--line);border-bottom:0;background:#fbfaff}
  .stdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
  .stdot.on{background:var(--ok)} .stdot.off{background:#c9c6d8}
  .crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;font-size:14px}
  .crumb a{color:var(--accent);font-weight:750;cursor:pointer}
  .crumb a:hover{text-decoration:underline}
  .crumb .sep{color:#c9c6d8}
  .crumb .cur{color:var(--ink);font-weight:750}
  .crumb .crumb-hint{color:var(--muted);font-weight:500;font-size:12.5px}
  /* Relatórios */
  .reps{display:flex;flex-direction:column;gap:12px;max-width:900px}
  .rep{display:flex;gap:18px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;transition:.15s}
  .rep:hover{border-color:var(--accent-2);box-shadow:0 10px 26px -18px rgba(70,45,150,.65);transform:translateY(-1px)}
  .rep:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .rep .num{flex:0 0 auto;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:19px;font-weight:850;letter-spacing:-.02em}
  .rep .body{flex:1;min-width:0;display:block}
  .rep .t{display:block;font-size:16.5px;font-weight:800;line-height:1.25;margin-bottom:3px}
  .rep .d{display:block;font-size:13.5px;color:var(--muted)}
  .rep .rhl{display:block;font-size:13px;line-height:1.45;color:var(--ink);background:#faf9fe;border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-top:10px}
  .rep .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .rep .tg{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#f0ecff;color:var(--accent)}
  .rep .go{flex:0 0 auto;align-self:center;color:var(--accent);font-weight:800;font-size:13px}
  .repframe{width:100%;height:calc(100dvh - 190px);min-height:440px;border:1px solid var(--line);border-radius:16px;background:var(--card);display:block}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(20,15,45,.45);display:none;place-items:center;padding:18px;z-index:30}
  .modal-bg.on{display:grid}
  .modal{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:26px}
  .modal h2{margin:0 0 4px;font-size:20px}.modal .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .kv{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv .k{color:var(--muted);min-width:120px;font-weight:600}
  .ans{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
  .ans .q{font-size:13px;color:var(--muted);margin-bottom:3px}.ans .a{font-size:14px;font-weight:600}.ans .tag{font-size:11px;color:var(--accent);font-weight:700}
  .x{float:right;border:0;background:#f0eef8;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:16px}
  @media(max-width:600px){ .hide-sm{display:none} }
</style>
</head>
<body>
<div id="app"></div>

<script>
const app=document.getElementById('app');
let TAB='analytics', LEADS=[], ANALYTICS=null, CAMP=null, crmView='cards', anMetaOnly=false, dFrom, dTo;
const PERFIS=['Perfeccionista','Evitativo','Impulsivo','Sobrecarregado','Indeciso'];
// produtos da esteira (atalhos do 🛒 Compras no modal do lead) — edita aqui se mudar nome/preço
const PRODUCTS=[
  {name:'Fundamentos da Procrastinação',value:49.90},
  {name:'Metas em Movimento',value:19.90},
  {name:'Pilares da Produtividade',value:297},
];
const EMO={Perfeccionista:'🎯',Evitativo:'🚪',Impulsivo:'⚡',Sobrecarregado:'🌀',Indeciso:'🧭'};
// rótulos das etapas do funil (mesma ordem do FLOW do quiz)
const STEPS=['Abriu o quiz','Gênero','Idade','Pergunta 1','Pergunta 2','Pergunta 3','“Não é preguiça”','Pergunta 4','Pergunta 5','Pergunta 6','Pergunta 7','Método (ciência)','WhatsApp 📲','Nome','Calculando','Perfil revelado','Página de oferta 🛒'];

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(s){try{return new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});}catch{return s;}}
function waDigits(w){return String(w||'').replace(/\D/g,'');}
function iso(d){return new Date(d.getTime()-3*3600e3).toISOString().slice(0,10);} // data no fuso do Brasil (UTC-3)
// quando o lead caiu na coluna atual (fallback: data de criação, p/ leads anteriores à migração)
function colAt(l){return l.status_at||l.created_at;}
function sinceTxt(s){const ms=Date.now()-new Date(s).getTime();if(!isFinite(ms)||ms<6e4)return 'agora mesmo';
  const m=Math.floor(ms/6e4);if(m<60)return 'há '+m+'min';const h=Math.floor(m/60);if(h<24)return 'há '+h+'h';
  const d=Math.floor(h/24);return d===1?'há 1 dia':'há '+d+' dias';}
function daysAgo(n){return iso(new Date(Date.now()-n*864e5));}

async function boot(){
  const r=await fetch('/api/leads');
  if(r.status===401){ renderLogin(); return; }
  if(!r.ok){ app.innerHTML='<div class="empty">Erro ao carregar. Recarregue.</div>'; return; }
  LEADS=(await r.json()).leads||[];
  dFrom=daysAgo(30); dTo=iso(new Date());
  enter();
}

/* ---------- LOGIN ---------- */
function renderLogin(msg){
  app.innerHTML=`<div class="login-wrap"><form class="login" id="lf">
    <img src="/logo.png" alt="Kenji Hirota"/>
    <h1>🔒 Painel do Kenji</h1><p>Entre para ver o funil e os leads.</p>
    <input class="input" id="pw" type="password" placeholder="Senha" autofocus />
    <div class="err" id="err">${msg||''}</div>
    <button class="btn full" type="submit">Entrar</button></form></div>`;
  document.getElementById('lf').addEventListener('submit',async e=>{
    e.preventDefault();const err=document.getElementById('err');err.textContent='';
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});
    if(r.ok) boot(); else { const j=await r.json().catch(()=>({}));err.textContent=j.error||'Falha no login.'; }
  });
}

/* ---------- SHELL ---------- */
function enter(){
  app.innerHTML=`
    <div class="top">
      <img class="logo" src="/logo.png" alt="Kenji Hirota"/>
      <div class="tabs">
        <button class="tab" id="tab-analytics" onclick="switchTab('analytics')">📊 Analytics</button>
        <button class="tab" id="tab-campanhas" onclick="switchTab('campanhas')">📣 Campanhas</button>
        <button class="tab" id="tab-crm" onclick="switchTab('crm')">👥 CRM</button>
        <button class="tab" id="tab-relatorios" onclick="switchTab('relatorios')">📄 Relatórios</button>
      </div>
      <div class="spacer"></div>
      <button class="btn sm ghost" onclick="logout()">Sair</button>
    </div>
    <div class="wrap" id="content"></div>
    <div class="modal-bg" id="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>`;
  renderContent();
}
function switchTab(t){ TAB=t; renderContent(); }
function renderContent(){
  ['analytics','campanhas','crm','relatorios'].forEach(t=>{
    const el=document.getElementById('tab-'+t); if(el) el.classList.toggle('on',TAB===t);
  });
  if(TAB==='analytics') renderAnalytics();
  else if(TAB==='campanhas') renderCampaigns();
  else if(TAB==='relatorios') renderReports();
  else renderCRM();
}
async function logout(){ await fetch('/api/logout',{method:'POST'}); renderLogin(); }

/* ---------- ANALYTICS ---------- */
function renderAnalytics(){
  const c=document.getElementById('content');
  c.innerHTML=`
    <div class="dates">
      <div><label>De</label><input type="date" id="df" value="${dFrom}"></div>
      <div><label>Até</label><input type="date" id="dt" value="${dTo}"></div>
      <button class="btn sm" onclick="applyDates()">Aplicar</button>
      ${datePresetBtns()}
    </div>
    <label class="mswitch" style="margin:2px 2px 16px" title="Só sessões de anúncio pago do Meta (com utm_campaign + utm_source de Facebook/Instagram). Deixa de fora orgânico, time e tráfego direto."><input type="checkbox" ${anMetaOnly?'checked':''} onchange="toggleMetaOnly(this.checked)"><span class="track"></span><span class="lbl">Mostrar só anúncios do Meta</span></label>
    <div id="an-body">${ANALYTICS?analyticsBody():'<div class="loading">Carregando métricas…</div>'}</div>`;
  if(!ANALYTICS) loadAnalytics();
}
function applyDates(){ dFrom=document.getElementById('df').value; dTo=document.getElementById('dt').value; loadAnalytics(); }
function toggleMetaOnly(v){ anMetaOnly=v; ANALYTICS=null; loadAnalytics(); }
function datePresetBtns(){
  const b=(k,l)=>`<button class="preset" onclick="setDatePreset('${k}')">${l}</button>`;
  return `<div class="presets">${b('hoje','Hoje')}${b('ontem','Ontem')}${b('mes','Este mês')}${b('mespassado','Mês passado')}${b('7','7 dias')}${b('30','30 dias')}${b('tudo','Tudo')}</div>`;
}
function datePreset(k){
  const b=new Date(Date.now()-3*3600e3), Y=b.getUTCFullYear(), M=b.getUTCMonth(), t=iso(new Date()); // "agora" no Brasil
  const pad=x=>String(x).padStart(2,'0'), first=(y,m)=>`${y}-${pad(m+1)}-01`;
  if(k==='hoje') return {from:t,to:t};
  if(k==='ontem'){ const y=iso(new Date(Date.now()-864e5)); return {from:y,to:y}; }
  if(k==='mes') return {from:first(Y,M), to:t};
  if(k==='mespassado'){ const py=M===0?Y-1:Y, pm=M===0?11:M-1, last=new Date(Date.UTC(Y,M,0)).getUTCDate(); return {from:first(py,pm), to:`${py}-${pad(pm+1)}-${pad(last)}`}; }
  if(k==='tudo') return {from:daysAgo(365), to:t};
  return {from:daysAgo(Number(k)||30), to:t};
}
function setDatePreset(k){ const r=datePreset(k); dFrom=r.from; dTo=r.to;
  if(TAB==='campanhas'){ CAMP=null; renderCampaigns(); } else { ANALYTICS=null; renderAnalytics(); } }
async function loadAnalytics(){
  const body=document.getElementById('an-body'); if(body) body.innerHTML='<div class="loading">Carregando métricas…</div>';
  const r=await fetch(`/api/analytics?from=${dFrom}&to=${dTo}${anMetaOnly?'&source=meta':''}`);
  if(r.status===401){ renderLogin(); return; }
  ANALYTICS=r.ok?await r.json():{funnel:[],sessions:0,leads:0,byAd:[],byProfile:[],comercial:{vendas:0,valor:0},comercialByAd:[]};
  const b=document.getElementById('an-body'); if(b) b.innerHTML=analyticsBody();
}
function analyticsBody(){
  const A=ANALYTICS;
  const conv=A.sessions?Math.round(A.leads/A.sessions*100):0;
  // funil cumulativo: reached[i] = soma das sessões com max_step >= i
  const reached=STEPS.map((_,i)=>(A.funnel||[]).filter(r=>r.max_step>=i).reduce((a,r)=>a+r.n,0));
  const start=reached[0]||0;
  const funnelHTML=STEPS.map((label,i)=>{
    const n=reached[i]||0, pct=start?Math.round(n/start*100):0;
    const prev=i>0?(reached[i-1]||0):n, drop=prev?Math.round((1-n/prev)*100):0;
    return `<div class="fstep">
      <div class="fl"><span>${i+1}. ${label}</span><span class="c">${n} · ${pct}%</span></div>
      <div class="ftrack"><i style="width:${Math.max(pct,start?1:0)}%"></i></div>
      ${i>0&&drop>0?`<div class="fdrop">↓ perdeu ${drop}% aqui</div>`:''}</div>`;
  }).join('');
  const ads=(A.byAd||[]);
  const maxAd=Math.max(1,...ads.map(a=>a.leads));
  const adsHTML=ads.length?`<table><thead><tr><th>Origem</th><th>Campanha</th><th>Anúncio</th><th style="width:120px">Leads</th></tr></thead><tbody>${
    ads.map(a=>`<tr><td>${esc(a.source)}</td><td class="hide-sm">${esc(a.campaign)}</td><td>${esc(a.ad)}</td>
      <td><div style="display:flex;align-items:center;gap:8px"><b>${a.leads}</b><div class="minibar" style="flex:1"><i style="width:${Math.round(a.leads/maxAd*100)}%"></i></div></div></td></tr>`).join('')
  }</tbody></table>`:'<div class="empty">Nenhum lead com UTM nesse período.</div>';
  const profs=(A.byProfile||[]).filter(p=>p.profile&&p.profile!=='—');
  const maxP=Math.max(1,...profs.map(p=>p.n));
  const profHTML=profs.length?profs.map(p=>`<div class="fstep"><div class="fl"><span>${EMO[p.profile]||''} ${esc(p.profile)}</span><span class="c">${p.n}</span></div><div class="ftrack" style="height:16px"><i style="width:${Math.round(p.n/maxP*100)}%"></i></div></div>`).join(''):'<div class="empty">Sem diagnósticos no período.</div>';
  // 💼 Comercial — vendas fechadas na mão (tag no CRM)
  const com=A.comercial||{vendas:0,valor:0};
  const cAds=A.comercialByAd||[];
  const maxCV=Math.max(1,...cAds.map(a=>a.valor||0));
  const comTable=cAds.length?`<table><thead><tr><th>Origem</th><th class="hide-sm">Campanha</th><th>Anúncio</th><th style="width:90px">Vendas</th><th style="width:190px">Valor fechado</th></tr></thead><tbody>${
    cAds.map(a=>`<tr><td>${esc(a.source)}</td><td class="hide-sm">${esc(a.campaign)}</td><td>${esc(a.ad)}</td><td><b>${a.vendas}</b></td>
      <td><div style="display:flex;align-items:center;gap:8px"><b style="white-space:nowrap">${cMoney(a.valor,'BRL')}</b><div class="minibar" style="flex:1"><i style="width:${Math.round((a.valor||0)/maxCV*100)}%"></i></div></div></td></tr>`).join('')
  }</tbody></table>`:'<div class="empty">Nenhuma venda do comercial nesse período. Pra atribuir: CRM → abre o lead → liga 💼 Venda do comercial.</div>';
  const comHTML=`<div class="panel"><h3>💼 Comercial — vendas fechadas pelo time</h3>
    <div class="stats" style="margin-bottom:16px">
      <div class="stat"><div class="n st-vendido">${com.vendas||0}</div><div class="l">Vendas do comercial</div></div>
      <div class="stat"><div class="n st-vendido" style="font-size:22px;line-height:1.3">${cMoney(com.valor||0,'BRL')}</div><div class="l">Valor total fechado</div></div>
      <div class="stat"><div class="n" style="color:var(--accent);font-size:22px;line-height:1.3">${com.vendas?cMoney((com.valor||0)/com.vendas,'BRL'):'—'}</div><div class="l">Ticket médio</div></div>
    </div>
    ${comTable}
    <p class="fineprint">Atribuição pela <b>UTM do lead</b> (o anúncio que gerou o lead) e pela <b>data em que o lead entrou</b>. O período e o switch "só anúncios do Meta" valem aqui também. Pra marcar uma venda: CRM → abre o lead → 💼 Venda do comercial + valor.</p>
  </div>`;
  return `
    <div class="stats">
      <div class="stat"><div class="n">${A.sessions}</div><div class="l">Iniciaram o quiz</div></div>
      <div class="stat"><div class="n st-vendido">${A.leads}</div><div class="l">Leads (WhatsApp)</div></div>
      <div class="stat"><div class="n" style="color:var(--accent)">${conv}%</div><div class="l">Conversão</div><div class="sub">de quem abriu virou lead</div></div>
    </div>
    ${comHTML}
    <div class="panel"><h3>📉 Funil — % de passagem por etapa</h3>${funnelHTML}</div>
    <div class="panel"><h3>📣 De qual anúncio vieram os leads</h3>${adsHTML}</div>
    <div class="panel"><h3>🧩 Leads por perfil</h3>${profHTML}</div>`;
}

/* ---------- CAMPANHAS (Meta) — espelho do Gerenciador ---------- */
let campLevel='campaign', campSel={campaign:null,adset:null};
function cMoney(v,cur){ if(v==null||v==='') return '—'; try{return new Intl.NumberFormat('pt-BR',{style:'currency',currency:cur||'BRL'}).format(Number(v));}catch{return 'R$ '+Number(v).toFixed(2);} }
function cInt(v){ return new Intl.NumberFormat('pt-BR').format(Math.round(Number(v)||0)); }
function cPct(v,d){ return v==null?'—':Number(v).toFixed(d==null?2:d)+'%'; }
function cRoas(v){ return v?Number(v).toFixed(2)+'x':'—'; }
function renderCampaigns(){
  const c=document.getElementById('content');
  c.innerHTML=`
    <div class="dates">
      <div><label>De</label><input type="date" id="cf" value="${dFrom}"></div>
      <div><label>Até</label><input type="date" id="ct" value="${dTo}"></div>
      <button class="btn sm" onclick="applyCampDates()">Aplicar</button>
      ${datePresetBtns()}
    </div>
    <div id="camp-body">${CAMP?campaignsBody():'<div class="loading">Carregando…</div>'}</div>`;
  if(!CAMP) loadCampaigns();
}
function applyCampDates(){ dFrom=document.getElementById('cf').value; dTo=document.getElementById('ct').value; CAMP=null; loadCampaigns(); }
async function loadCampaigns(){
  const body=document.getElementById('camp-body'); if(body) body.innerHTML='<div class="loading">Carregando…</div>';
  const p=new URLSearchParams({from:dFrom,to:dTo,level:campLevel});
  if(campLevel==='adset'&&campSel.campaign) p.set('parent',campSel.campaign.id);
  if(campLevel==='ad'&&campSel.adset) p.set('parent',campSel.adset.id);
  let r; try{ r=await fetch('/api/campaigns?'+p.toString()); }catch(e){ CAMP={connected:true,error:'Sem conexão com o servidor.'}; }
  if(r){ if(r.status===401){ renderLogin(); return; } CAMP=r.ok?await r.json():{connected:true,error:'Erro ao carregar (servidor).'}; }
  const b=document.getElementById('camp-body'); if(b) b.innerHTML=campaignsBody();
}
function drill(id){
  const row=((CAMP&&CAMP.rows)||[]).find(x=>String(x.id)===String(id)); if(!row) return;
  if(campLevel==='campaign'){ campSel={campaign:{id:row.id,name:row.name},adset:null}; campLevel='adset'; }
  else if(campLevel==='adset'){ campSel.adset={id:row.id,name:row.name}; campLevel='ad'; }
  else return;
  CAMP=null; renderCampaigns();
}
function goLevel(lvl){
  if(lvl==='campaign'){ campLevel='campaign'; campSel={campaign:null,adset:null}; }
  else if(lvl==='adset'){ campLevel='adset'; campSel.adset=null; }
  CAMP=null; renderCampaigns();
}
function campCrumb(){
  const p=[`<a onclick="goLevel('campaign')">📣 Campanhas</a>`];
  if(campSel.campaign){ p.push('<span class="sep">›</span>'); p.push(campLevel==='adset'?`<span class="cur">${esc(campSel.campaign.name)}</span>`:`<a onclick="goLevel('adset')">${esc(campSel.campaign.name)}</a>`); }
  if(campSel.adset){ p.push('<span class="sep">›</span>'); p.push(`<span class="cur">${esc(campSel.adset.name)}</span>`); }
  const hint=campLevel==='campaign'?'clique numa campanha → conjuntos':campLevel==='adset'?'clique num conjunto → anúncios':'nível de anúncios';
  return `<div class="crumb">${p.join(' ')}<span class="crumb-hint">· ${hint}</span></div>`;
}
function mrow(c,cur,drillable){
  const nm=`<span class="stdot ${c.status==='ACTIVE'?'on':'off'}" title="${esc(c.status||'')}"></span><b>${esc(c.name||'—')}</b>${drillable?' <span class="dq">›</span>':''}`;
  return `<tr class="${drillable?'clk':''}"${drillable?` onclick="drill('${esc(String(c.id))}')"`:''}>
    <td class="nm">${nm}</td>
    <td class="num">${cMoney(c.spend,cur)}</td>
    <td class="num">${cInt(c.our_leads)}</td>
    <td class="num">${c.cpl!=null?cMoney(c.cpl,cur):'—'}</td>
    <td class="num">${cPct(c.start_rate,1)}</td>
    <td class="num">${cPct(c.vsl_rate,1)}</td>
    <td class="num">${c.vendas?cInt(c.vendas):'—'}</td>
    <td class="num">${c.faturamento?cMoney(c.faturamento,cur):'—'}</td>
    <td class="num">${cRoas(c.roas)}</td>
    <td class="num">${c.cpa!=null?cMoney(c.cpa,cur):'—'}</td>
    <td class="num">${c.custo_ic!=null?cMoney(c.custo_ic,cur):'—'}</td>
    <td class="num">${cInt(c.clicks)}</td>
    <td class="num">${c.cpc!=null?cMoney(c.cpc,cur):'—'}</td>
    <td class="num">${cPct(c.ctr)}</td>
    <td class="num">${cPct(c.hook,1)}</td>
    <td class="num">${cPct(c.body,1)}</td>
    <td class="num">${c.dias!=null?c.dias+'d':'—'}</td>
  </tr>`;
}

  const rows=D.rows||[], t=D.totals||{}, cur=D.currency, drillable=campLevel!=='ad';
  const noun=campLevel==='campaign'?'campanha':campLevel==='adset'?'conjunto':'anúncio';

          <th class="num">CPA</th><th class="num">Custo/IC</th><th class="num">Cliques</th><th class="num">CPC</th><th class="num">CTR link</th>

          <tr class="totrow"><td class="nm">TOTAL</td>
            <td class="num">${cMoney(t.spend,cur)}</td><td class="num">${cInt(t.our_leads)}</td><td class="num">${t.cpl!=null?cMoney(t.cpl,cur):'—'}</td><td class="num">${cPct(t.start_rate,1)}</td><td class="num">${cPct(t.vsl_rate,1)}</td><td class="num">${t.vendas?cInt(t.vendas):'—'}</td>
            <td class="num">${t.faturamento?cMoney(t.faturamento,cur):'—'}</td><td class="num">${cRoas(t.roas)}</td>

            <td class="num">${cInt(t.clicks)}</td><td class="num">${t.cpc!=null?cMoney(t.cpc,cur):'—'}</td><td class="num">${cPct(t.ctr)}</td>
            <td class="num">${cPct(t.hook,1)}</td><td class="num">${cPct(t.body,1)}</td><td class="num">—</td>

  return `${campCrumb()}

    </div>

/* ---------- CRM ---------- */
function purTotal(l){return (l.purchases||[]).reduce((a,p)=>a+(Number(p.value)||0),0);}
// Reembolsado conta como lead (é tráfego real) mas NÃO conta como receita — o dinheiro voltou.
// O total reembolsado fica visível no card pra nada desaparecer no silêncio.
function crmCounts(){const c={total:0,novo:0,contatado:0,vendido:0,reembolsado:0,perdido:0,teste:0,com:0,comValor:0,fat:0,reembValor:0};
  LEADS.forEach(l=>{c[l.status]=(c[l.status]||0)+1;
    if(l.status==='teste')return;
    c.total++;
    if(l.status==='reembolsado'){c.reembValor+=purTotal(l);return;}
    c.fat+=purTotal(l);
    if(l.comercial){c.com++;c.comValor+=Number(l.sale_value)||0;}});
  return c;}
function renderCRM(){
  const c=crmCounts();
  document.getElementById('content').innerHTML=`
    <div class="stats">
      <div class="stat"><div class="n" id="c-total">${c.total}</div><div class="l">Total de leads</div></div>
      <div class="stat"><div class="n st-novo" id="c-novo">${c.novo||0}</div><div class="l">Novos</div></div>
      <div class="stat"><div class="n st-contatado" id="c-cont">${c.contatado||0}</div><div class="l">Contatados</div></div>
      <div class="stat"><div class="n st-vendido" id="c-vend">${c.vendido||0}</div><div class="l">Vendidos</div></div>
      <div class="stat"><div class="n st-vendido" id="c-com">${c.com}</div><div class="l">💼 Comercial</div><div class="sub" id="c-comsub">${cMoney(c.comValor,'BRL')} fechados</div></div>
      <div class="stat"><div class="n" id="c-fat" style="color:#a06a00;font-size:22px;line-height:1.3">${cMoney(c.fat,'BRL')}</div><div class="l">💰 Total em compras</div><div class="sub" id="c-fatsub">${c.reembValor>0?`líquido · ${cMoney(c.reembValor,'BRL')} reembolsados fora`:'o que os leads já deixaram'}</div></div>
    </div>
    <div class="toolbar">
      <input class="input" id="q" placeholder="🔎 Buscar por nome, WhatsApp, perfil, UTM..." oninput="renderList()" />
      <select id="fp" onchange="renderList()"><option value="">Todos os perfis</option>${PERFIS.map(p=>`<option value="${p}">${EMO[p]} ${p}</option>`).join('')}</select>
      <select id="fs" onchange="renderList()"><option value="">Todos os status</option>${['novo','contatado','vendido','reembolsado','perdido','teste'].map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
      <div class="viewtoggle">
        <button id="v-cards" class="${crmView==='cards'?'on':''}" onclick="setView('cards')">▦ Colunas</button>
        <button id="v-list" class="${crmView==='list'?'on':''}" onclick="setView('list')">☰ Lista</button>
      </div>
      <button class="btn sm ghost" onclick="doExport()">⬇️ CSV</button>
    </div>
    <div id="crm-list"></div>`;
  renderList();
}
function setView(v){crmView=v;document.getElementById('v-cards').classList.toggle('on',v==='cards');document.getElementById('v-list').classList.toggle('on',v==='list');renderList();}
function filtered(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const fp=document.getElementById('fp').value, fs=document.getElementById('fs').value;
  return LEADS.filter(l=>{
    if(fp&&l.profile!==fp)return false; if(fs&&l.status!==fs)return false;
    if(q){const hay=((l.name||'')+' '+l.whatsapp+' '+l.profile+' '+JSON.stringify(l.utm||{})).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
}
function origin(l){const u=l.utm||{};const ad=u.utm_content||u.utm_term,cmp=u.utm_campaign,src=u.utm_source;
  if(!src&&!cmp&&!ad)return null;return {src:src||'—',cmp:cmp||'—',ad:ad||'—'};}
function statusSel(l){return `<select class="status st-${l.status}" onchange="setStatus(${l.id},this.value,this)">${['novo','contatado','vendido','reembolsado','perdido','teste'].map(o=>`<option value="${o}"${o===l.status?' selected':''}>${o}</option>`).join('')}</select>`;}
function renderList(){
  const rows=filtered(), el=document.getElementById('crm-list');
  if(!rows.length){el.innerHTML='<div class="empty">Nenhum lead. Assim que alguém terminar o quiz, aparece aqui. 👀</div>';return;}
  if(crmView==='cards'){
    el.className='';
    const cols=[{k:'novo',l:'Novo',c:'var(--novo)'},{k:'contatado',l:'Contatado',c:'var(--contatado)'},{k:'vendido',l:'Vendido',c:'var(--vendido)'},{k:'reembolsado',l:'↩️ Reembolsado',c:'var(--reembolsado)'},{k:'perdido',l:'Perdido',c:'var(--perdido)'},{k:'teste',l:'🧪 Teste',c:'var(--teste)'}];
    el.innerHTML='<div class="board">'+cols.map(s=>{
      // ordena pela data em que o lead caiu NESTA coluna — mais recente no topo
      const items=rows.filter(l=>l.status===s.k).sort((a,b)=>new Date(colAt(b))-new Date(colAt(a)));
      return `<div class="column" ondragover="event.preventDefault()" ondragenter="this.classList.add('over')" ondragleave="if(event.target===this)this.classList.remove('over')" ondrop="dropCard(event,'${s.k}')">
        <div class="colhead"><span class="dotc" style="background:${s.c}"></span>${s.l}<span class="cnt">${items.length}</span></div>
        <div class="colbody">${items.map(kcard).join('')||'<div class="colempty">Arraste um lead pra cá</div>'}</div>
      </div>`;
    }).join('')+'</div>';
  } else {
    el.className='';
    el.innerHTML=`<div class="tablecard"><table><thead><tr><th>Data</th><th>Nome</th><th>WhatsApp</th><th>Perfil</th><th class="hide-sm">Anúncio</th><th>Status</th><th></th></tr></thead><tbody>${
      rows.map(l=>{const o=origin(l),wa=waDigits(l.whatsapp);
        return `<tr><td style="color:var(--muted);white-space:nowrap">${fmtDate(l.created_at)}</td>
        <td style="font-weight:650">${esc(l.name)||'—'}${l.comercial?` <span class="compill" title="Venda do comercial">💼 ${l.sale_value!=null?cMoney(l.sale_value,'BRL'):''}</span>`:''}${purTotal(l)>0?` <span class="buypill" title="Total em compras atribuídas">💰 ${cMoney(purTotal(l),'BRL')}</span>`:''}</td>
        <td><a class="wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">💬 ${esc(l.whatsapp)}</a></td>
        <td>${l.profile?`<span class="pill">${EMO[l.profile]||''} ${esc(l.profile)}</span>`:'—'}</td>
        <td class="hide-sm" style="color:var(--muted);font-size:12.5px">${o?esc(o.ad):'—'}</td>
        <td>${statusSel(l)}</td><td><button class="link" onclick='openModal(${l.id})'>ver</button></td></tr>`;}).join('')
    }</tbody></table></div>`;
  }
}
function kcard(l){const o=origin(l),wa=waDigits(l.whatsapp);
  const moveu=Math.abs(new Date(colAt(l))-new Date(l.created_at))>6e4; // mudou de coluna depois de entrar
  return `<div class="kcard" draggable="true" ondragstart="dragStart(event,${l.id})">
    <div class="nm">${esc(l.name)||'—'}</div>
    <div class="dt">${fmtDate(l.created_at)}</div>
    ${moveu?`<div class="incol" title="Caiu nesta coluna em ${fmtDate(colAt(l))}">🕐 nesta coluna ${sinceTxt(colAt(l))}</div>`:''}
    ${l.profile?`<span class="pill">${EMO[l.profile]||''} ${esc(l.profile)}</span>`:''}
    ${l.comercial?`<span class="compill" title="Venda do comercial">💼 ${l.sale_value!=null?cMoney(l.sale_value,'BRL'):'Comercial'}</span>`:''}
    ${purTotal(l)>0?`<span class="buypill" title="Total em compras atribuídas">💰 ${cMoney(purTotal(l),'BRL')}</span>`:''}
    <a class="wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">💬 ${esc(l.whatsapp)}</a>
    <div class="korigin">📣 ${o?esc(o.ad):'direto'}</div>
    <button class="link" style="text-align:left;padding:0" onclick='openModal(${l.id})'>ver detalhes →</button>
  </div>`;}
function dragStart(e,id){ e.dataTransfer.setData('text/plain',String(id)); e.dataTransfer.effectAllowed='move'; window._dragId=id; }
async function dropCard(e,status){ e.preventDefault();
  document.querySelectorAll('.column.over').forEach(c=>c.classList.remove('over'));
  const id=parseInt(e.dataTransfer.getData('text/plain'),10)||window._dragId;
  const l=LEADS.find(x=>x.id===id); if(!l){return;} if(l.status===status){renderList();return;}
  l.status=status; l.status_at=new Date().toISOString(); renderList(); refreshCounts();
  const r=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});
  if(!r.ok) alert('Não consegui salvar. Recarregue a página.');
}
function refreshCounts(){const c=crmCounts();const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  set('c-total',c.total);set('c-novo',c.novo||0);set('c-cont',c.contatado||0);set('c-vend',c.vendido||0);
  set('c-com',c.com);set('c-comsub',cMoney(c.comValor,'BRL')+' fechados');set('c-fat',cMoney(c.fat,'BRL'));
  set('c-fatsub',c.reembValor>0?'líquido · '+cMoney(c.reembValor,'BRL')+' reembolsados fora':'o que os leads já deixaram');}
async function setStatus(id,status,el){
  if(el)el.className='status st-'+status;
  const l=LEADS.find(x=>x.id===id); if(l&&l.status!==status){l.status=status;l.status_at=new Date().toISOString();}
  renderList(); refreshCounts();
  const r=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});
  if(!r.ok) alert('Não consegui salvar o status.');
}
function openModal(id){
  const l=LEADS.find(x=>x.id===id);if(!l)return;
  const ans=(l.answers||[]).map(a=>`<div class="ans"><div class="q">${esc(a.q)}</div><div class="a">${esc(a.a)}</div><div class="tag">→ ${esc(a.perfil)}</div></div>`).join('');
  const utm=l.utm&&Object.keys(l.utm).length?Object.entries(l.utm).map(([k,v])=>`<div class="kv"><div class="k">${esc(k)}</div><div>${esc(v)}</div></div>`).join(''):'<div class="kv"><div class="k">—</div><div>tráfego direto</div></div>';
  document.getElementById('modal').innerHTML=`
    <button class="x" onclick="closeModal()">✕</button>
    <h2>${EMO[l.profile]||''} ${esc(l.name)||'Lead'}</h2>
    <div class="sub">${l.profile?'O '+esc(l.profile)+' · ':''}${fmtDate(l.created_at)}</div>
    <div class="kv"><div class="k">WhatsApp</div><div><a class="wa" href="https://wa.me/${waDigits(l.whatsapp)}" target="_blank" rel="noopener">${esc(l.whatsapp)}</a></div></div>
    <div class="kv"><div class="k">Gênero / Idade</div><div>${esc(l.gender)||'—'} · ${esc(l.age)||'—'}</div></div>
    <div class="kv"><div class="k">Status</div><div>${statusSel(l)}</div></div>
    <div class="kv" style="align-items:flex-start"><div class="k">💼 Comercial</div><div style="flex:1">
      <label class="mswitch"><input type="checkbox" ${l.comercial?'checked':''} onchange="comToggle(${l.id},this.checked)"><span class="track"></span><span class="lbl">Venda fechada pelo comercial</span></label>
      <div id="comval" style="display:${l.comercial?'block':'none'};margin-top:10px">
        <input class="input" id="com-v" inputmode="decimal" placeholder="Valor fechado — ex.: 3.000" value="${l.sale_value!=null?Number(l.sale_value).toLocaleString('pt-BR'):''}" style="margin-bottom:8px">
        <div class="presets" style="margin-bottom:8px;flex-wrap:wrap">
          <button class="preset" onclick="comFill('49,90')">R$ 49,90</button>
          <button class="preset" onclick="comFill('397')">R$ 397</button>
          <button class="preset" onclick="comFill('3.000')">R$ 3.000</button>
        </div>
        <button class="btn sm" onclick="comSave(${l.id})">Salvar valor</button>
        <span id="com-msg" style="margin-left:8px;font-size:13px;font-weight:700;color:var(--ok)"></span>
      </div>
    </div></div>
    <h3 style="margin:18px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)">🛒 Compras — o que esse lead já deixou</h3>
    <div id="purwrap">${purBlock(l)}</div>
    <h3 style="margin:18px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)">Respostas</h3>${ans||'<div class="sub">—</div>'}
    <h3 style="margin:18px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)">Origem (UTM)</h3>${utm}
    <div style="margin-top:20px;padding-top:14px;border-top:1px solid var(--line);text-align:right"><button class="link" style="color:#d63b4a" onclick="delLead(${l.id})">🗑️ Excluir este lead</button></div>`;
  document.getElementById('modalbg').classList.add('on');
}
function closeModal(){document.getElementById('modalbg').classList.remove('on');}
/* 💼 Comercial: marca a venda fechada pelo time + valor */
function comFill(v){const e=document.getElementById('com-v');if(e){e.value=v;e.focus();}}
function parseBRL(s){s=String(s||'').replace(/[^\d.,]/g,'');if(!s)return null;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');           // 3.000,50 → 3000.50
  else if((s.match(/\./g)||[]).length>1||/\.\d{3}$/.test(s))s=s.replace(/\./g,''); // 3.000 → 3000
  const v=parseFloat(s);return isFinite(v)&&v>=0?v:null;}
async function comToggle(id,on){
  const l=LEADS.find(x=>x.id===id);if(!l)return;
  const box=document.getElementById('comval');
  if(on){ if(box){box.style.display='block';const e=document.getElementById('com-v');if(e)e.focus();} return; } // liga de fato no "Salvar valor"
  l.comercial=false;l.sale_value=null;ANALYTICS=null;
  if(box)box.style.display='none';
  renderList();refreshCounts();
  const r=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,comercial:false})});
  if(!r.ok)alert('Não consegui salvar. Recarregue a página.');
}
/* 🛒 Compras do lead (LTV) */
function purBlock(l){
  const ps=l.purchases||[];
  const rows=ps.map((p,i)=>`<div class="purrow"><div><b>${esc(p.name)}</b><span class="purdt">${p.at?' · '+fmtDate(p.at):''}</span></div>
    <div style="display:flex;align-items:center;gap:10px"><b>${cMoney(p.value,'BRL')}</b><button class="purx" onclick="purDel(${l.id},${i})" title="Remover">✕</button></div></div>`).join('');
  return `${rows||'<div style="color:var(--muted);font-size:13px;padding:4px 0">Nenhuma compra atribuída ainda.</div>'}
    ${ps.length?`<div class="purrow purtot"><div>Total deixado</div><div>${cMoney(purTotal(l),'BRL')}</div></div>`:''}
    <div class="presets" style="flex-wrap:wrap;margin-top:10px">
      ${PRODUCTS.map((p,i)=>`<button class="preset" onclick="purAdd(${l.id},${i})">+ ${esc(p.name)} · ${cMoney(p.value,'BRL')}</button>`).join('')}
      <button class="preset" onclick="purToggleCustom()">+ Personalizado…</button>
    </div>
    <div id="purcustom" style="display:none;margin-top:10px">
      <input class="input" id="pur-name" placeholder="Nome do produto" style="margin-bottom:8px">
      <input class="input" id="pur-val" inputmode="decimal" placeholder="Valor — ex.: 197 ou 49,90" style="margin-bottom:8px">
      <button class="btn sm" onclick="purAddCustom(${l.id})">Adicionar compra</button>
    </div>`;
}
function purToggleCustom(){const e=document.getElementById('purcustom');if(!e)return;
  const on=e.style.display!=='none';e.style.display=on?'none':'block';
  if(!on){const n=document.getElementById('pur-name');if(n)n.focus();}}
function refreshPur(l){const w=document.getElementById('purwrap');if(w)w.innerHTML=purBlock(l);renderList();refreshCounts();}
async function purSave(l){
  const r=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:l.id,purchases:l.purchases})});
  if(!r.ok)alert('Não consegui salvar a compra. Recarregue a página.');
}
function purAdd(id,idx){
  const l=LEADS.find(x=>x.id===id),p=PRODUCTS[idx];if(!l||!p)return;
  l.purchases=(l.purchases||[]).concat([{name:p.name,value:p.value,at:new Date().toISOString()}]);
  refreshPur(l);purSave(l);
}
function purAddCustom(id){
  const l=LEADS.find(x=>x.id===id);if(!l)return;
  const name=((document.getElementById('pur-name')||{}).value||'').trim();
  const v=parseBRL((document.getElementById('pur-val')||{}).value);
  if(!name||v==null){alert('Preenche o nome do produto e um valor válido. Ex.: 197 ou 49,90');return;}
  l.purchases=(l.purchases||[]).concat([{name,value:v,at:new Date().toISOString()}]);
  refreshPur(l);purSave(l);
}
function purDel(id,i){
  const l=LEADS.find(x=>x.id===id);if(!l||!(l.purchases||[])[i])return;
  l.purchases=l.purchases.slice(0,i).concat(l.purchases.slice(i+1));
  refreshPur(l);purSave(l);
}
async function comSave(id){
  const l=LEADS.find(x=>x.id===id);if(!l)return;
  const raw=(document.getElementById('com-v')||{}).value||'';
  const v=parseBRL(raw);
  if(raw.trim()&&v==null){alert('Valor inválido. Ex.: 3.000 ou 49,90');return;}
  l.comercial=true;l.sale_value=v;ANALYTICS=null;
  renderList();refreshCounts();
  const msg=document.getElementById('com-msg');if(msg)msg.textContent='Salvo ✓';
  const r=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,comercial:true,sale_value:v})});
  if(!r.ok){if(msg)msg.textContent='';alert('Não consegui salvar. Recarregue a página.');}
}
async function delLead(id){
  if(!confirm('Excluir este lead? Essa ação não tem volta.'))return;
  const r=await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  if(r.ok){LEADS=LEADS.filter(x=>x.id!==id);closeModal();renderContent();}else alert('Não consegui excluir.');
}
function doExport(){
  const rows=filtered();const cols=['data','nome','whatsapp','perfil','genero','idade','status','comercial','valor_comercial','compras','total_compras','utm_source','utm_campaign','utm_content'];
  const csv=[cols.join(',')].concat(rows.map(l=>{const u=l.utm||{};
    const compras=(l.purchases||[]).map(p=>`${p.name} (${String(p.value).replace('.',',')})`).join(' | ');
    return [fmtDate(l.created_at),l.name,l.whatsapp,l.profile,l.gender,l.age,l.status,l.comercial?'sim':'',l.sale_value!=null?String(l.sale_value).replace('.',','):'',compras,purTotal(l)?String(purTotal(l).toFixed(2)).replace('.',','):'',u.utm_source||'',u.utm_campaign||'',u.utm_content||'']
      .map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',');})).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='leads-kenji.csv';a.click();
}

boot();
</script>
</body>
</html>
