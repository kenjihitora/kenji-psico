<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O seu Diagnóstico Procrastinador · Kenji Hirota</title>
<meta property="og:title" content="O seu Diagnóstico Procrastinador">
<meta property="og:description" content="Um raio-x profundo do padrão que te faz travar — e como começar a interromper. Por Kenji Hirota, psicólogo.">
<meta property="og:type" content="article">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#211f38; --muted:#6b6a80; --line:#eeeaf7; --card:#ffffff;
    --acc:#6d4bf5; --soft:#efeafe;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
  body{font-family:"Fraunces",Georgia,serif;color:var(--ink);
    background:linear-gradient(180deg,#f3f0fe,#eef3ff);min-height:100vh;line-height:1.75;font-size:17.5px}
  .prog{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,var(--acc),#9068ff);z-index:50;transition:width .1s}
  .sheet{max-width:680px;margin:0 auto;padding:0 18px 80px}
  .head-ui{font-family:"Poppins",sans-serif}

  /* topo */
  .hero{text-align:center;padding:46px 0 8px}
  .emoji{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;
    font-size:54px;margin:0 auto 20px;box-shadow:0 24px 50px -22px var(--acc),0 0 0 10px var(--soft)}
  .kick{font-family:"Poppins",sans-serif;font-size:12.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
  h1{font-family:"Poppins",sans-serif;font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-1px;margin-bottom:18px}
  h1 .lt{color:var(--muted);font-weight:600;display:block;font-size:20px;letter-spacing:0;margin-bottom:2px}
  .ess{font-size:20px;color:#4a4863;font-style:italic;line-height:1.5;max-width:560px;margin:0 auto}

  /* corpo (folha branca) */
  .paper{background:var(--card);border-radius:26px;box-shadow:0 30px 80px -40px rgba(70,45,150,.4);
    padding:44px 40px;margin-top:34px}
  h2{font-family:"Poppins",sans-serif;font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.2;
    margin:38px 0 16px;color:var(--ink)}
  h2:first-child{margin-top:0}
  h2 .n{color:var(--acc)}
  p{margin:0 0 18px}
  .lead-p{font-size:18.5px}
  b,strong{font-weight:600;color:#161528}

  /* lista de reconhecimento */
  .recon{list-style:none;margin:6px 0 8px}
  .recon li{display:flex;gap:13px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:17px}
  .recon li:last-child{border-bottom:0}
  .recon li::before{content:"✓";flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--acc);
    font-family:"Poppins",sans-serif;font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:2px}

  /* callout */
  .callout{background:var(--soft);border-radius:18px;padding:22px 24px;margin:24px 0;font-size:18px;line-height:1.55}
  .callout b{color:var(--acc)}

  /* ciclo */
  .cycle{counter-reset:c;margin:8px 0 4px}
  .cycle li{list-style:none;counter-increment:c;display:flex;gap:15px;align-items:flex-start;padding:9px 0;font-size:16.5px}
  .cycle li::before{content:counter(c);flex:0 0 30px;width:30px;height:30px;border-radius:50%;
    background:var(--acc);color:#fff;font-family:"Poppins",sans-serif;font-weight:700;font-size:14px;display:grid;place-items:center}

  /* técnicas */
  .tech{border:1px solid var(--line);border-radius:20px;padding:24px 24px 20px;margin:18px 0;position:relative}
  .tech .tn{position:absolute;top:-16px;left:22px;width:34px;height:34px;border-radius:11px;
    background:linear-gradient(140deg,var(--acc),#9068ff);color:#fff;font-family:"Poppins",sans-serif;font-weight:800;
    display:grid;place-items:center;font-size:16px;box-shadow:0 8px 18px -8px var(--acc)}
  .tech h3{font-family:"Poppins",sans-serif;font-size:19px;font-weight:700;margin:8px 0 10px;line-height:1.25}
  .pratica{background:#faf8ff;border-left:4px solid var(--acc);border-radius:0 12px 12px 0;padding:14px 16px;margin-top:14px;font-size:16px}
  .pratica .pl{font-family:"Poppins",sans-serif;font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--acc);display:block;margin-bottom:5px}

  /* CTA + assinatura */
  .cta{background:linear-gradient(160deg,var(--soft),#f4f0ff);border-radius:22px;padding:30px 28px;margin:36px 0 0;text-align:center}
  .oferta{display:inline-block;font-family:"Poppins",sans-serif;font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--acc),#9068ff);padding:6px 14px;border-radius:999px;margin-bottom:14px}
  .cta-sub{font-family:"Poppins",sans-serif;font-size:12.5px;color:var(--muted);margin-top:12px;font-weight:500}
  .cta h3{font-family:"Poppins",sans-serif;font-size:21px;font-weight:800;margin-bottom:10px;line-height:1.25}
  .cta p{font-size:16.5px;color:#4a4863}
  .btn{display:inline-block;font-family:"Poppins",sans-serif;font-weight:700;font-size:16px;color:#fff;text-decoration:none;
    background:linear-gradient(135deg,var(--acc),#9068ff);padding:15px 30px;border-radius:14px;margin-top:16px;
    box-shadow:0 16px 34px -14px var(--acc)}
  .sign{display:flex;align-items:center;justify-content:center;gap:14px;margin:40px 0 0;text-align:left}
  .sign .k{width:46px;height:46px;border-radius:14px;background:linear-gradient(140deg,var(--acc),#9068ff);color:#fff;
    font-family:"Poppins",sans-serif;font-weight:800;font-size:22px;display:grid;place-items:center;flex:0 0 auto}
  .sign .who{font-family:"Poppins",sans-serif;font-weight:700;font-size:16px;line-height:1.3}
  .sign .who span{display:block;font-weight:500;font-size:13px;color:var(--muted)}
  .soon{text-align:center;padding:60px 20px;color:var(--muted);font-size:18px}

  @media(max-width:560px){
    body{font-size:17px}
    h1{font-size:32px} .ess{font-size:18px}
    .paper{padding:30px 22px;border-radius:22px}
    .hero{padding:34px 0 6px}
    .emoji{width:88px;height:88px;font-size:44px}
  }
</style>
</head>

function esc(s){return String(s==null?'':s);}
function render(){
  const mp=location.pathname.match(/\/diagnostico\/([^/?#]+)/); // URL limpa /diagnostico/PERFIL
  const p=((new URLSearchParams(location.search).get('p'))||(mp&&decodeURIComponent(mp[1]))||'perfeccionista').toLowerCase();
  const d=CONTENT[p];
  const app=document.getElementById('app');
  if(!d){
    app.innerHTML='<div class="soon">✍️ O conteúdo completo do seu perfil está sendo finalizado. Volte em breve!</div>';
    return;
  }
  document.documentElement.style.setProperty('--acc',d.acc);
  document.documentElement.style.setProperty('--soft',d.soft);
  document.title='Perfil '+d.nome+' · Diagnóstico Procrastinador';
  app.innerHTML=`
    <div class="hero">
      <div class="emoji">${d.emoji}</div>
      <div class="kick">Diagnóstico do seu perfil</div>
      <h1><span class="lt">Você é o</span>${d.nome}</h1>
      <p class="ess">${d.essencia}</p>
    </div>
    <div class="paper">
      <h2>Se você chegou até aqui, <span class="n">provavelmente…</span></h2>
      <ul class="recon">${d.reconhece.map(r=>`<li>${r}</li>`).join('')}</ul>

      <h2>O que está <span class="n">realmente</span> acontecendo</h2>
      ${d.mecanismo.map(x=>`<p class="lead-p">${x}</p>`).join('')}
      <div class="callout">${d.callout}</div>

      <h2>A mentira que te <span class="n">contaram</span></h2>
      ${d.mentira.map(x=>`<p>${x}</p>`).join('')}

      <h2>O ciclo que te mantém <span class="n">preso</span></h2>
      <ol class="cycle">${d.ciclo.map(x=>`<li>${x}</li>`).join('')}</ol>
      <p style="margin-top:14px;color:var(--muted)">${d.cicloFecho}</p>

      <h2>3 movimentos pra começar a <span class="n">virar o jogo</span></h2>
      ${d.movimentos.map((m,i)=>`<div class="tech"><div class="tn">${i+1}</div>
        <h3>${m.titulo}</h3><p>${m.texto}</p>
        <div class="pratica"><span class="pl">Na prática</span>${m.pratica}</div></div>`).join('')}

      <div class="cta">
        <div class="oferta">🎁 Oferta especial pra quem fez o teste</div>
        <h3>${d.fecho.titulo}</h3>
        <p>${d.fecho.texto}</p>
        <a class="btn" href="https://pay.kiwify.com.br/xBMVt0h?utm_source=diagnostico&utm_medium=whatsapp&utm_content=${p}" target="_blank" rel="noopener">${d.fecho.botao}</a>
        <div class="cta-sub">Fim da Procrastinação · acesso imediato</div>
      </div>

      <div class="sign">
        <span class="k">K</span>
        <span class="who">Kenji Hirota<span>Psicólogo · CRP 18/09596</span></span>
      </div>
    </div>`;
}
render();

addEventListener('scroll',()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  prog.style.width=(h>0?(scrollY/h*100):0)+'%';
},{passive:true});
