  .opt{

  .in-right{animation-name:inR}.in-left{animation-name:inL}.out-left{animation-name:outL}.out-right{animation-name:outR}
  @keyframes inR{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
  @keyframes inL{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
  @keyframes outL{from{opacity:1}to{opacity:0;transform:translateX(-30px)}}
  @keyframes outR{from{opacity:1}to{opacity:0;transform:translateX(30px)}}

  const key=computeResult();
  return `<div class="grow" style="flex:.35 0 auto"></div>
    <h1 class="vsl-h1">O SEU PERFIL PROCRASTINADOR É O <span style="color:var(--accent)">${key.toUpperCase()}</span>. DESCUBRA COMO NEUTRALIZÁ-LO 👇</h1>
    <div id="vturb-mount" style="margin:20px 0"></div>
    <div class="grow"></div>`;
}
const stage = document.getElementById('stage');
const bar   = document.getElementById('bar');
const backBtn = document.getElementById('backBtn');
const brand = document.querySelector('.brand');

/* ---- scoring ---- */
function scores(){const s={};Object.keys(PROFILES).forEach(k=>s[k]=0);
  Object.values(state.answers).forEach(a=>s[a.p]+=a.weight);return s;}
function computeResult(){const s=scores();let mx=-1,top=[];
  for(const k in s){if(s[k]>mx){mx=s[k];top=[k];}else if(s[k]===mx)top.push(k);}
  const q7=state.answers[6]&&state.answers[6].p;
  if(top.length>1&&q7&&top.includes(q7))return q7;return top[0];}

/* ---- navigation ---- */
function setProgress(){bar.style.width=Math.round((state.pos/(FLOW.length-1))*100)+"%";
  backBtn.classList.toggle('hide', state.pos===0 || NOBACK.has(FLOW[state.pos].type));}
function go(next,dir){dir=dir||'fwd';const cur=stage.firstElementChild;
  if(cur)cur.classList.add(dir==='fwd'?'out-left':'out-right');
  setTimeout(()=>{state.pos=next;render(dir);},cur?250:0);}
function back(){if(state.pos>0)go(state.pos-1,'back');}

function render(dir){setProgress();stage.innerHTML="";
  const node=FLOW[state.pos];brand.style.display=node.type==='intro'?'none':'';const el=document.createElement('div');
  el.className="screen "+(dir==='back'?'in-left':'in-right');
  const V={intro:viewIntro,name:viewName,gender:()=>viewPick("gender"),age:()=>viewPick("age"),
    q:()=>viewQuestion(node.i),teaser:viewTeaser,science:viewScience,email:viewEmail,
    calc:viewCalc,reveal:viewReveal,result:viewResult,vsl:viewVsl};
  el.innerHTML=V[node.type]();stage.appendChild(el);
  if(node.type==="q")bindQuestion(node.i);
  if(node.type==="name")bindName();
  if(node.type==="gender")bindPick("gender");
  if(node.type==="age")bindPick("age");
  if(node.type==="email")bindEmail();
  if(node.type==="calc")runCalc();
  if(node.type==="reveal")requestAnimationFrame(()=>animBars());
  if(node.type==="result")fb('track','ViewContent',{content_name:'Resultado: '+computeResult()});
  if(node.type==="vsl"){ mountVturb(computeResult()); fb('trackCustom','VSLView',{content_name:computeResult()}); }
  stage.parentElement.scrollTop=0;window.scrollTo(0,0);}

/* ---- views ---- */
function viewIntro(){return `
  <div class="grow"></div>
  <div style="text-align:center;margin-bottom:24px">
    <img src="/logo.png" alt="Kenji Hirota" style="width:190px;max-width:64%;height:auto;display:inline-block"/>
    <div style="font-size:12px;font-weight:700;letter-spacing:1.5px;color:#8a88a0;margin-top:2px">CRP 18/09596</div>
  </div>
  <div class="step">Diagnóstico gratuito · 2 min</div>
  <h1>Descubra o seu <span style="color:var(--accent)">Perfil Procrastinador</span></h1>
  <p class="sub">Existem 5 perfis de procrastinação. Responda essas 7 perguntas rápidas e descubra qual é o seu e como interromper esse ciclo.</p>
  <div class="grow"></div>
  <button class="btn" onclick="fb('trackCustom','QuizStart');go(1)">Começar o diagnóstico <span>🚀</span></button>`;}

function viewName(){return `<div class="grow"></div><div class="step">Pra começar</div>
  <h2>Como podemos te chamar?</h2>
  <p class="sub">Seu primeiro nome, pra deixar o seu diagnóstico mais pessoal.</p>
  <input class="input" id="nm" type="text" placeholder="Seu primeiro nome" autocomplete="given-name" value="${(state.name||'').replace(/"/g,'&quot;')}" />
  <div class="grow"></div>
  <button class="btn" id="nmBtn" ${state.name?'':'disabled'} onclick="submitName()">Continuar <span>→</span></button>`;}
function bindName(){const inp=document.getElementById('nm'),btn=document.getElementById('nmBtn');
  const ok=v=>v.trim().length>=2;
  inp.addEventListener('input',()=>btn.disabled=!ok(inp.value));
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!btn.disabled)submitName();});}
function submitName(){state.name=document.getElementById('nm').value.trim();go(state.pos+1);}

function viewPick(kind){
  const cfg=kind==="gender"?{step:"Pra começar",q:"Como você se identifica?",list:GENDER}
    :{step:"Quase lá",q:"Qual a sua idade?",list:AGE};
  const cur=state[kind];
  const opts=cfg.list.map((o,i)=>`<button class="opt big${cur===o.t?' sel':''}" data-i="${i}">
    <span class="em">${o.e}</span><span class="txt">${o.t}</span></button>`).join("");
  return `<div class="grow"></div><div class="step">${cfg.step}</div>
    <h2>${cfg.q}</h2><div class="options">${opts}</div><div class="grow"></div>`;}
function bindPick(kind){const list=kind==="gender"?GENDER:AGE;
  stage.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(stage.querySelector('.opt.sel:not([data-i="'+b.dataset.i+'"])')){}
    state[kind]=list[+b.dataset.i].t;
    stage.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');setTimeout(()=>go(state.pos+1),320);}));}

function viewQuestion(i){const q=QUESTIONS[i];const sel=state.answers[i]&&state.answers[i].idx;
  const opts=q.options.map((o,idx)=>`<button class="opt${sel===idx?' sel':''}" data-i="${idx}">
    <span class="em">${o.e}</span><span class="txt">${o.t}</span></button>`).join("");
  return `<div class="step">${q.step}</div>${q.lead?`<p class="lead">${q.lead}</p>`:""}
    <h2>${q.question}</h2><div class="options">${opts}</div><div class="grow"></div>`;}
function bindQuestion(i){const q=QUESTIONS[i];
  stage.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(stage.querySelector('.opt.sel'))return;
    b.classList.add('sel');const idx=+b.dataset.i;
    state.answers[i]={p:q.options[idx].p,weight:q.weight,idx};
    setTimeout(()=>go(state.pos+1),340);}));}

function viewTeaser(){return `<div class="grow"></div><div class="center">
  <div class="teaser-ico">🧠</div>
  <h2>Você NÃO é preguiçoso. Seu cérebro é que te engana!</h2>
  <p class="sub">A procrastinação nasce de um ciclo automático entre <b>sentimentos, pensamentos e ações.</b> Existem 5 padrões de procrastinador. A boa notícia: quando você descobre o seu padrão, fica muito mais fácil vencê-la.</p></div>
  <div class="grow"></div><button class="btn" onclick="go(${state.pos+1})">Continuar <span>→</span></button>`;}

function viewScience(){return `<div class="grow"></div><div class="center">
  <div class="teaser-ico">🔬</div>
  <h2>Um método baseado em ciência do comportamento</h2>
  <p class="sub">Seu diagnóstico usa o modelo da Terapia Cognitivo-Comportamental (TCC) — a mesma abordagem que a pesquisa mostra ter os melhores resultados com procrastinação. Sem achismo, sem “dica genérica de produtividade”.</p></div>
  <div class="grow"></div><button class="btn" onclick="go(${state.pos+1})">Continuar <span>→</span></button>`;}

function viewEmail(){return `<div class="grow"></div><div class="step">💬 Falta pouco</div>
  <h2>Pra qual WhatsApp enviamos o seu diagnóstico completo?</h2>
  <p class="sub">Seu resultado personalizado — com o seu perfil, o seu gatilho e o próximo passo — chega direto no seu WhatsApp.</p>
  <div class="phone"><span class="ddi">🇧🇷 +55</span>
    <input class="input" id="wa" type="tel" inputmode="numeric" placeholder="(11) 99999-9999" autocomplete="tel-national" /></div>
  <div class="grow"></div>
  <button class="btn" id="emailBtn" disabled onclick="submitEmail()">Ver o meu perfil <span>👀</span></button>
  <div class="disc">Você recebe o diagnóstico no WhatsApp. Sem spam — saia quando quiser.</div>`;}
function fmtPhone(v){v=(v||"").replace(/\D/g,'').slice(0,11);
  if(v.length<=2)return v.length?'('+v:'';
  if(v.length<=6)return '('+v.slice(0,2)+') '+v.slice(2);
  if(v.length<=10)return '('+v.slice(0,2)+') '+v.slice(2,6)+'-'+v.slice(6);
  return '('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7);}
function bindEmail(){const inp=document.getElementById('wa'),btn=document.getElementById('emailBtn');
  const ok=v=>v.replace(/\D/g,'').length>=10;
  if(state.whatsapp){inp.value=fmtPhone(state.whatsapp);btn.disabled=!ok(inp.value);}
  inp.addEventListener('input',()=>{inp.value=fmtPhone(inp.value);btn.disabled=!ok(inp.value);});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!btn.disabled)submitEmail();});}
function answersExport(){return QUESTIONS.map((q,i)=>{const a=state.answers[i];
  return a?{q:q.question,a:q.options[a.idx].t,perfil:a.p}:null;}).filter(Boolean);}
function submitEmail(){state.whatsapp=document.getElementById('wa').value.replace(/\D/g,'');
  const payload={name:state.name,whatsapp:'+55'+state.whatsapp,gender:state.gender,age:state.age,
    profile:computeResult(),scores:scores(),answers:answersExport(),utm:state.utm};
  fetch('/api/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{});
  fb('track','Lead',{content_name:payload.profile});
  go(state.pos+1);}

function viewCalc(){const steps=["Analisando seus comportamentos","Mapeando seus pensamentos automáticos","Identificando sua emoção dominante","Localizando o seu gatilho principal","Montando o seu diagnóstico"];
  return `<div class="grow"></div><div class="center">
    <div class="ring"><svg width="112" height="112" viewBox="0 0 112 112">
      <circle cx="56" cy="56" r="48" fill="none" stroke="#eeecf6" stroke-width="10"/>
      <circle id="ringFill" cx="56" cy="56" r="48" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-dasharray="302" stroke-dashoffset="302"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4bf5"/><stop offset="1" stop-color="#9068ff"/></linearGradient></defs></svg>
      <div class="pct" id="pct">0%</div></div>
    <div class="checklist" id="checklist">${steps.map((s,i)=>`<div class="cl" data-i="${i}"><span class="mk">✓</span><span>${s}</span></div>`).join("")}</div>
    </div><div class="grow"></div>`;}
function runCalc(){const fill=document.getElementById('ringFill'),pct=document.getElementById('pct');
  const cls=[...document.querySelectorAll('.cl')];const DUR=3600,C=302;let start=null;
  function frame(t){if(!start)start=t;const p=Math.min(1,(t-start)/DUR);
    const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    fill.style.strokeDashoffset=C*(1-e);pct.textContent=Math.round(e*100)+"%";
    cls.forEach((c,i)=>{if(e>=(i+1)/cls.length-0.02)c.classList.add('on');});
    if(p<1)requestAnimationFrame(frame);else setTimeout(()=>go(state.pos+1),420);}
  requestAnimationFrame(frame);}

function pctScores(){const s=scores();const tot=Object.values(s).reduce((a,b)=>a+b,0)||1;
  return Object.keys(s).map(k=>({k,v:s[k],pct:Math.round(s[k]/tot*100)})).sort((a,b)=>b.v-a.v);}
function viewReveal(){const key=computeResult();const pf=PROFILES[key];const rows=pctScores();
  const bars=rows.map((r,i)=>`<div class="barrow${i===0?' top':''}">
    <div class="bl"><span>${PROFILES[r.k].emoji} O ${r.k}</span><span class="pc">${r.pct}%</span></div>
    <div class="track"><i data-w="${r.pct}"></i></div></div>`).join("");
  return `<div class="grow"></div><div class="center">
    <div class="rev-ico">${pf.emoji}</div>
    <div class="res-badge">Seu perfil predominante</div>
    <div class="res-name">O ${key}</div></div>
    <div class="bars">${bars}</div>
    <div class="grow"></div>
    <button class="btn" onclick="go(${state.pos+1})">Ver o meu diagnóstico completo <span>→</span></button>`;}
function animBars(){document.querySelectorAll('.track > i').forEach(i=>i.style.width=i.dataset.w+"%");}

function cycleHTML(pf){const n=[["Gatilho",pf.gatilho],["Pensamento",'"'+pf.pensamento+'"'],["Emoção",pf.emocao],["Comportamento",pf.comportamento]];
  return `<div class="cyc">${n.map((x,i)=>`<div class="row"><div class="n">${i+1}</div><div><div class="k">${x[0]}</div><div class="v">${x[1]}</div></div></div>${i<3?'<div class="arr">↓</div>':'<div class="arr">↩ e o ciclo recomeça</div>'}`).join("")}</div>`;}
function viewResult(){const key=computeResult();const pf=PROFILES[key];
  return `<div class="center"><div style="font-size:46px;margin:8px 0 6px">${pf.emoji}</div>
    <div class="res-badge">Seu Perfil de Procrastinação</div><div class="res-name">O ${key}</div></div>
    <p class="res-desc">${pf.desc}</p>
    <div class="facts">
      <div class="fact"><span class="emo">🎯</span><div><div class="k">Gatilho principal</div><div class="v">${pf.gatilho}</div></div></div>
      <div class="fact"><span class="emo">💭</span><div><div class="k">Pensamento automático</div><div class="v">"${pf.pensamento}"</div></div></div>
      <div class="fact"><span class="emo">❤️</span><div><div class="k">Emoção dominante</div><div class="v">${pf.emocao}</div></div></div></div>
    <h3 class="sec">O ciclo normalmente acontece assim</h3>${cycleHTML(pf)}
    <div class="offer"><h3 class="sec" style="margin-top:0">Seu próximo passo</h3>
      <p>Seu diagnóstico mostrou <b>O QUE</b> te trava. Agora o Kenji vai te mostrar exatamente <b>COMO neutralizar</b> o padrão do <b>${key}</b> — no vídeo do próximo passo.</p>
      <div class="good">✅ Isso não é a sua personalidade. É apenas um padrão aprendido — e padrões podem ser modificados.</div>
      <button class="btn" onclick="go(FLOW.findIndex(f=>f.type==='vsl'))">Descobrir como neutralizar o meu perfil <span>→</span></button></div>
    <div style="height:8px"></div>`;}
function goToOffer(key){
  fb('track','InitiateCheckout',{content_name:'Protocolo '+key});
  // WIRE: window.location.href='https://SEU-CHECKOUT?perfil='+encodeURIComponent(key);
  console.log('CTA -> checkout | perfil:',key,'| whatsapp:',state.whatsapp);
  alert('Aqui entra o checkout do Protocolo Anti-Procrastinação (perfil: '+key+').');}

render();
</script>
</body>
</html>
